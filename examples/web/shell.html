<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cform gallery</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #14151a;
      color: #9aa0a6;
      font: 13px/1.4 system-ui, sans-serif;
    }

    /* The canvas' CSS box is the page. SDL's Emscripten video driver reads
     * that box when the window is created resizable and matches the drawing
     * buffer to it, so a wider tab lays the page out against a wider surface
     * rather than scaling the same picture. `inset: 0` tracks the layout
     * viewport, which follows the window and docked dev tools; `100vh` does not,
     * so it left a strip of the cleared buffer showing when the console closed.
     * The width/height attributes below are only what a browser without
     * WebAssembly sees.
     *
     * The WebGL context carries an alpha channel, so a pixel the page has not
     * painted shows this background through the canvas rather than a color of
     * its own. It is the theme's page tone (#f5f5f5, src/theme/default.c) so the
     * first frame and any box the stream leaves uncovered read as the same
     * surface the native window paints, not a dark hole. */
    #canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      background: #f5f5f5;
    }
  </style>
  <script>
    /* SDL asks the browser for a WebGL context with preserveDrawingBuffer off,
     * the default. A browser then clears the drawing buffer every time it
     * composites the canvas, so any frame the shell does not redraw before the
     * next composite - the idle frame it presents without drawing, the wait for
     * the next event - shows the cleared buffer: the page flickers to black
     * under the cursor and a gap opens below the console. Locking the attribute
     * on keeps the last drawn frame in the buffer, so a composite the shell did
     * not redraw still shows that frame. The context type is left exactly as it
     * was asked for; only the one attribute is added. */
    (function () {
      var getContext = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function (type, attributes) {
        if (type === 'webgl' || type === 'webgl2' || type === 'experimental-webgl') {
          attributes = Object.assign({}, attributes, { preserveDrawingBuffer: true });
        }
        return getContext.call(this, type, attributes);
      };
    })();
  </script>
</head>

<body>
  <canvas id="canvas" width="960" height="600" tabindex="0">cform needs a browser with WebGL2.</canvas>
  {{{ SCRIPT }}}
</body>

</html>
