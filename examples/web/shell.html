<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cform gallery</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #14151a;
      color: #9aa0a6;
      font: 13px/1.4 system-ui, sans-serif;
    }

    /* The canvas' CSS box is the page. SDL's Emscripten video driver reads
     * that box when the window is created resizable and matches the drawing
     * buffer to it, so a wider tab lays the page out against a wider surface
     * rather than scaling the same picture. The width/height attributes below
     * are only what a browser without WebAssembly sees. */
    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      outline: none;
      background: #000;
    }

    .hint {
      position: fixed;
      left: 12px;
      bottom: 8px;
      margin: 0;
      opacity: 0.6;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <canvas id="canvas" width="960" height="600" tabindex="0" oncontextmenu="event.preventDefault()">cform needs a
    browser with WebGL2.</canvas>
  <p class="hint">Click the buttons, scroll the list, drag the field's text. F12 opens the inspector.</p>
  {{{ SCRIPT }}}
</body>

</html>
