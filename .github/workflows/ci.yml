name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} · ${{ matrix.type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SDL3 build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxcursor-dev libxrandr-dev libxss-dev \
            libxtst-dev libxxf86vm-dev libasound2-dev \
            mesa-common-dev libgl1-mesa-dev libudev-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.type }} -DCFORM_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.type }} --parallel

      - name: Test
        run: ctest --test-dir build --build-config ${{ matrix.type }} --output-on-failure

  web:
    name: WebAssembly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Configure and build in one shell so the emsdk environment (EMSDK,
      # which the "web" preset reads) stays alive across the steps.
      - name: Build browser target
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          cd "$HOME/emsdk"
          ./emsdk install 3.1.64
          ./emsdk activate 3.1.64
          source ./emsdk_env.sh
          cd "$GITHUB_WORKSPACE"
          cmake --preset web
          cmake --build --preset web

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: cform-ui-web
          path: build/web/bin/cform_demo.*
