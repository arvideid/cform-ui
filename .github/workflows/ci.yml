name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format · static analysis · layer graph
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned: formatting output depends on the clang-format version, and an
      # unpinned runner would drift from the version contributors use locally.
      - name: Install clang tools
        run: |
          python3 -m pip install clang-format==19.1.5
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-tidy

      - name: Format
        run: |
          mapfile -t sources < <(git ls-files \
            'include/cf/*.h' 'src/*/*.[ch]' 'tests/*/*.[ch]' 'examples/*.c')
          clang-format --dry-run --Werror "${sources[@]}"

      - name: Layer graph
        run: python3 tools/check_includes.py

      - name: Static analysis
        run: |
          # Configure once to write compile_commands.json, with tests and the SDL
          # backend on so the database carries every target's real flags, the SDL
          # headers among them. Hand-written include flags could not name those
          # dependency paths, so backend sources went unanalysed.
          cmake -S . -B build-tidy -DCMAKE_BUILD_TYPE=Debug \
            -DCFORM_BUILD_TESTS=ON -DCFORM_WITH_SDL_BACKEND=ON
          # The amalgamated case includes a header the build generates before it
          # compiles, so it is skipped here; the same declarations are read
          # through every other unit that includes cf/. The installed-consumer
          # program lives beside the tests but is not built by them - it is
          # configured by the package job against an installed tree - so its
          # compilation flags are not in build-tidy and clang-tidy's heuristic
          # fallback would miss the cf/ include path.
          mapfile -t sources < <(git ls-files 'src/*/*.c' 'tests/*/*.c' \
            | grep -Ev '^tests/(unit/layout_amalgamated\.c|consumer/)')
          clang-tidy --quiet -p build-tidy --warnings-as-errors='*' "${sources[@]}"

  build:
    name: ${{ matrix.os }} · ${{ matrix.type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        # The SDL backend and the examples compile on all three operating
        # systems: the backend is where the draw path lives, and an example is
        # a build-time proof a layer stays standalone. Only the compile is
        # checked - a window is what a human looks at.
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.type }} -DCFORM_BUILD_TESTS=ON -DCFORM_BUILD_EXAMPLES=ON -DCFORM_WITH_SDL_BACKEND=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.type }} --parallel

      - name: Test
        run: ctest --test-dir build --build-config ${{ matrix.type }} --output-on-failure -LE bench

      # The floors a project outside this repository consumes: the archives,
      # the headers and both discovery files have to land, and an interface that
      # named a build-tree target would fail here rather than on the
      # consumer's machine.
      - name: Install
        run: cmake --install build --prefix stage --config ${{ matrix.type }}

      # The rigs print the numbers a reviewer reads and only fail on a geometry
      # assertion, so they get a step of their own: a passing Test step hides
      # stdout, and an instrumented allocator would time the sanitizer instead
      # of the engine. The rig emits `meta` and `result` lines, so the same
      # log becomes the historical artifact a reviewer diffs against the last
      # release rather than a wall of prose only a human can compare.
      - name: Bench
        shell: bash
        run: |
          ctest --test-dir build --build-config "${{ matrix.type }}" -L bench --verbose \
            | tee "bench-${{ matrix.os }}-${{ matrix.type }}.log"

      - name: Archive bench log
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}-${{ matrix.type }}
          path: bench-${{ matrix.os }}-${{ matrix.type }}.log
          retention-days: 90
          if-no-files-found: error

  # GCC and Clang are the only toolchains with the ASan/UBSan pair, so this is
  # one Linux job rather than a matrix row that would have to be excluded
  # everywhere else.
  sanitize:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang

      - name: Configure
        run: |
          # SDL is on so the sanitizer sees the draw path too: the recorder
          # covers the command stream, but the texture, font and GPU tables only
          # run their allocation through the SDL backend.
          cmake -S . -B build-san -G Ninja -DCMAKE_C_COMPILER=clang \
            -DCMAKE_BUILD_TYPE=Debug -DCFORM_BUILD_TESTS=ON \
            -DCFORM_WITH_SANITIZERS=ON -DCFORM_WITH_SDL_BACKEND=ON

      - name: Build
        run: cmake --build build-san --parallel

      - name: Test
        run: ctest --test-dir build-san --output-on-failure -LE bench

  # Installing is not the same as being consumable: a package whose discovery
  # files name a build-tree path or a configure-time prefix fails on the
  # consumer's machine, not the packager's. This job builds against an installed
  # tree through both routes - find_package and the relocatable pkg-config file
  # - at a prefix that was never configured, the only proof the floors reach a
  # project outside the repository.
  package:
    name: Installed-consumer (CMake + pkg-config)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pkg-config
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config

      - name: Install into an overridden prefix
        run: |
          cmake -S . -B build-pkg -DCMAKE_BUILD_TYPE=Release
          cmake --install build-pkg --prefix "$PWD/stage"

      # The two floors an outside project actually takes: find_package for the
      # CMake-native, pkg-config for the shell-driven. The consumer source is
      # checked in under `tests/consumer/` rather than generated by a heredoc,
      # because a heredoc whose body starts at column 0 terminates the YAML
      # literal block and js-yaml - what the runner parses with - rejects the
      # whole workflow before any step gets to run.
      - name: Consume through find_package
        run: |
          cmake -S tests/consumer -B build-consumer-cmake \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/stage"
          cmake --build build-consumer-cmake
          ./build-consumer-cmake/consumer

      - name: Consume through pkg-config
        run: |
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/stage/lib/pkgconfig"
          pkg-config --exists --print-errors cform
          cc tests/consumer/main.c $(pkg-config --cflags --libs cform) \
            -o build-consumer-pc
          ./build-consumer-pc

  # The browser is part of the reach claim, and the gallery in a tab is the same
  # source through the same backend, so the WebAssembly compile is a gate and not
  # a local step. The SDK is pinned because an ABI change mid-air would fail the
  # build for reasons nobody in the diff caused.
  wasm:
    name: WebAssembly gallery
    runs-on: ubuntu-latest
    env:
      EMSDK_VERSION: "7.0.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: Configure
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build-wasm -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCFORM_WITH_SDL_BACKEND=ON -DCFORM_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build-wasm --parallel
