<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>cform-ui demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #12141a;
            color: #d5d8de;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            overflow: hidden;
        }

        /* On mobile the URL bar overlays the bottom of a viewport-height box,
         * so dvh keeps the canvas equal to the space actually visible. Browsers
         * that do not know dvh keep the vh declaration above. */
        body {
            height: 100vh;
            height: 100dvh;
        }

        /* The demo's root frame is UI_FILL on both axes, so this box *is* the
         * layout: size it to the viewport and the UI fills the page. SDL only
         * follows CSS that is already there - it reads this element's box, keeps
         * the backing store equal to it times devicePixelRatio, and posts a
         * resize event whenever the window changes, which ui_render() turns into
         * a fresh layout pass. touch-action: none stops the page from swallowing
         * the drags the scrollable panels depend on. */
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #12141a;
            outline: none;
            touch-action: none;
        }

        #status {
            position: fixed;
            left: 12px;
            bottom: 12px;
            font-size: 12px;
            color: #6c7280;
        }
    </style>
</head>

<body>
    <canvas id="canvas" width="1280" height="800" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
    <div id="status">Loading cform-ui...</div>

    <script type='text/javascript'>
        // Give the backing store the viewport's real pixel grid before SDL takes
        // over, so the first frame is not a browser-stretched surface. SDL owns
        // these numbers from here on; it recomputes them on every resize.
        (function () {
            var canvas = document.getElementById('canvas');
            var dpr = window.devicePixelRatio || 1;
            canvas.width = Math.round(canvas.clientWidth * dpr);
            canvas.height = Math.round(canvas.clientHeight * dpr);
        })();

        var Module = {
            canvas: (function () { return document.getElementById('canvas'); })(),
            setStatus: function (text) {
                var el = document.getElementById('status');
                el.textContent = text ? text : '';
                if (!text) el.style.display = 'none';
            },
            onRuntimeInitialized: function () {
                document.getElementById('status').style.display = 'none';
            },
            printErr: function (text) { console.error(text); },
        };
    </script>

    {{{ SCRIPT }}}
</body>

</html>
